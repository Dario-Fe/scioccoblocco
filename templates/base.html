<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}ScioccoBlocco - Trekking & Bike{% endblock %}</title>
<meta name="description" content="{% block description %}Itinerari trekking e bike nel Verbano Cusio Ossola, Val Grande, Valli Ossolane{% endblock %}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ base_path }}/static/style.css">
<link rel="icon" type="image/x-icon" href="{{ base_path }}/static/favicon.ico">
</head>
<body>

<header class="site-header">
  <div class="header-main">
    <div class="header-logo">
      <a href="{{ base_path }}/">
        <img src="{{ base_path }}/static/1bg_top_03.gif" alt="ScioccoBlocco">
      </a>
      <div class="header-title">
        <h1>ScioccoBlocco</h1>
        <p>Itinerari nel Verbano Cusio Ossola</p>
      </div>
    </div>
  </div>
  <nav class="site-nav">
    <div class="nav-inner">
      <a href="{{ base_path }}/" {% if current == 'home' %}class="active"{% endif %}>Home</a>
      <a href="{{ base_path }}/chi-siamo/" {% if current == 'chi-siamo' %}class="active"{% endif %}>Chi Siamo</a>
      <a href="{{ base_path }}/contatti/" {% if current == 'contatti' %}class="active"{% endif %}>Contatti</a>
    </div>
  </nav>
</header>

<main class="main-content">
  {% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <p>
    &copy; 2026 <strong>ScioccoBlocco</strong> &mdash;
    <a href="{{ base_path }}/">Home</a> |
    <a href="{{ base_path }}/chi-siamo/">Chi Siamo</a> |
    <a href="{{ base_path }}/contatti/">Contatti</a>
  </p>

</footer>

<button class="back-to-top" onclick="window.scrollTo({top:0,behavior:'smooth'})" id="topBtn">&uarr;</button>

<script>
const btn = document.getElementById('topBtn');
window.addEventListener('scroll', () => {
  btn.classList.toggle('show', window.scrollY > 400);
});
</script>
</body>
</html>
